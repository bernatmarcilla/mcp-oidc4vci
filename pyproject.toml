[project]
name = "mcp-oidc4vci"
version = "0.1.0"
description = "MCP server exposing OIDC4VCI credential-issuance capabilities to AI agents"
readme = "README.md"
authors = [
    { name = "ikcoin", email = "ikcoin.kb@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "fastmcp>=3.4.7",
    "httpx>=0.28.1",
    "pyjwt>=2.13.0",
]

[project.scripts]
mcp-oidc4vci = "mcp_oidc4vci:main"

[build-system]
requires = ["uv_build>=0.12.6,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_oidc4vci"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=mcp_oidc4vci --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/mcp_oidc4vci"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
]
